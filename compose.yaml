#version: "3.8"
#
volumes:
    builder: {}
    runner: {}

services:
  # alpine-based image that installs and builds the jekyll blog
  builder:
    ports:
      - 4002:80
    environment:
      - git_hash
    build:
      context: "."
      dockerfile: "./Dockerfile.builder"
      tags:
        - "localhost:5000/gembag_builder:latest"
    entrypoint: ["/bin/sh"]
    # entrypoint: ["/bin/sh", "-c"]
    # command: "echo hmm"
    stop_signal: SIGINT
    volumes:
      - ./posts/seqart/:/app/oldsite/_posts/seqart/
      - ./drafts/seqart/:/app/oldsite/_posts/seqart/
      - ./posts/cs/:/app/oldsite/_posts/Tech/
      - ./drafts/cs/:/app/oldsite/_posts/Tech/
      - ./assets/:/app/oldsite/assets/
      - ./misc/about/images/:/app/oldsite/assets/about/
      - ./misc/linktree/linktree.html:/app/oldsite/_includes/
      # - ./misc/about/about.md:/app/oldsite/
  # nginx image that gets the jekyll built artifacts
  runner:
    ports:
      - 4000:80
    environment:
      - RUBY_VERSION=3.1.0
      - APPLICATION_USER=appuser
      - git_hash=${git_hash:-default_git_hash}
    build:
      context: "./"
      dockerfile: "./Dockerfile"
      tags:
        - "localhost:5000/gembag_runner:latest"
    volumes:
      - ./posts/seqart/:/app/oldsite/_posts/seqart/
      - ./drafts/seqart/:/app/oldsite/_posts/seqart/
      - ./posts/cs/:/app/oldsite/_posts/Tech/
      - ./drafts/cs/:/app/oldsite/_posts/Tech/
      # mkdir -p "$CONT_BUILDER":/app/oldsite/assets/images/posts/;
      # cp -r ./assets/images/posts/* "$CONT_BUILDER":/app/oldsite/assets/images/posts/;
      -  ./assets/ "$CONT_BUILDER":/app/oldsite/assets/
      # copy about files
      - ./misc/about/images/:/app/oldsite/assets/about/
      - ./misc/about/about.md:/app/oldsite/
      - ./misc/linktree/linktree.html:/app/oldsite/_includes/
    # entrypoint: ["/bin/sh", "-c"]
    # command: "echo hmm"
    stop_signal: SIGINT
  # =======================
  # Add anubis to avoid webscraping
  # by common fnck3rs
  anubis-nginx:
    image: ghcr.io/techarohq/anubis:latest
    environment:
      BIND: ":8080"
      DIFFICULTY: "5"
      METRICS_BIND: ":9090"
      SERVE_ROBOTS_TXT: "true"
      TARGET: "http://nginx"
    ports:
      - 8080:8080
  nginx:
    image: nginx
    volumes:
      - "./www:/usr/share/nginx/html"


